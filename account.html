  />

</head>
<body>

  <div class="text-center text-warning">
    <div class="spinner-border" role="status"></div>
    <h5 class="mt-3" id="loadingText">Loading...</h5>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">
      Prime Motors
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="home.html">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="motors.html">Motors</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="about.html">About Us</a>

        <li class="nav-item">
          <a class="nav-link" href="cart.html">Cart</a>
        </li>

      </ul>

    </div>
  </div>
</nav>

<section class="py-5 bg-light">
  <div class="container">

    <div class="text-center mb-5">
      <h1 class="fw-bold">User Account</h1>
      <p class="lead text-muted">
        Login, register, or manage your Prime Motors account.
      </p>
    </div>

    <div class="row justify-content-center">

      <div class="col-md-5">

        <div class="card shadow-sm p-4">

          <h4 class="fw-bold text-center mb-3">Login</h4>

          <!-- UPDATED FORM -->
          <form id="loginForm">

            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Email">
            </div>

            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password">
            </div>

            <button type="submit" class="btn btn-dark w-100 mb-2">
              Login
            </button>

          </form>

          <hr>

          <div class="text-center">

            <p class="mb-2 text-muted">Don’t have an account?</p>

            <button class="btn btn-warning w-100 mb-3">
              Register
            </button>

            <!-- UPDATED BUTTON -->
            <button id="logoutBtn" class="btn btn-outline-danger w-100">
              Logout
            </button>

          </div>

        </div>
      </div>

    </div>

  </div>
</section>

<!-- TOAST -->
<div class="toast-container position-fixed top-0 end-0 p-3">

  <div id="liveToast"
       class="toast align-items-center text-bg-success border-0"
       role="alert">

    <div class="d-flex">

      <div class="toast-body" id="toastMessage">
        Login Successfully!
      </div>

      <button type="button"
              class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast">
      </button>

    </div>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="function.js"></script>
